[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "trellis-agent"
version = "0.1.0"
description = "A small agent framework where planning and memory are measurable: eval-first, cost-capped, mock-testable."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Chen Xingtong" }]
keywords = ["ai-agent", "llm", "planning", "memory", "evaluation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "openai>=1.60,<2",
    "httpx>=0.27",
    "jsonschema>=4.20",
    "pyyaml>=6",
    "jieba>=0.42",
]

[project.optional-dependencies]
vector = ["numpy>=1.26"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "pytest-socket>=0.7",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "types-jsonschema",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trellis_agent"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/trellis_agent"]

[[tool.mypy.overrides]]
module = ["jieba", "jieba.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Network is blocked for every test (loopback only, for local fake-server tests),
# so CI can never reach a real API. `live` tests are opt-in: pytest -m live --force-enable-socket
addopts = "-m 'not live' --disable-socket --allow-hosts=127.0.0.1,::1 --allow-unix-socket"
markers = ["live: calls a real LLM API (manual only, never in CI)"]
filterwarnings = ["error"]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
branch = true
source = ["trellis_agent"]

[tool.coverage.report]
# Overall target 85%; may be lowered to 80% with the owner's approval (this is the only place to change).
fail_under = 85
show_missing = true
