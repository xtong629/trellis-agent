name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy
      - name: Test (network disabled, no secrets)
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Evaluation smoke run and regression gate (mock model, no network)
        run: |
          python -m trellis_agent.eval run evals/smoke --llm mock \
            --prices evals/prices.demo.yaml --out runs/smoke.json
          python -m trellis_agent.eval compare evals/baselines/smoke.json runs/smoke.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: reports-py${{ matrix.python-version }}
          path: |
            coverage.xml
            runs/smoke.json
          if-no-files-found: ignore
          retention-days: 14
