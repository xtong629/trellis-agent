# ==========================================================
# DEMO PRICES ONLY / 仅为示例,非真实价格
# These numbers do not correspond to any real model or vendor.
# 这些数字不对应任何真实模型或厂商。
# ==========================================================
#
# They exist only so the offline mock models ("mock", "mock-judge") have something to price.
# The currency "DEMO" is made up on purpose: it can never be mistaken for real money.
# For a real model, create your own file (see evals/prices.glm.yaml for the format) with the
# model's name, its currency, and the prices and source from your provider's pricing page.
models:
  mock:
    currency: DEMO
    per: 1M tokens
    input: 1.0
    output: 2.0
    note: made-up demo price
  mock-judge:
    currency: DEMO
    per: 1M tokens
    input: 1.0
    output: 2.0
    note: made-up demo price
